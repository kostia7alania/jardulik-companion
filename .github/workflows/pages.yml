name: Publish landing

on:
  push:
    branches: [main]
    paths:
      - 'internal/companion/web/**'
      - 'docs/images/landing-preview.png'
      - 'scripts/check_swagger.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jardulik-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Check API reference
        run: python3 scripts/check_swagger.py
      - name: Stage public files
        working-directory: internal/companion/web
        run: |
          mkdir -p "$RUNNER_TEMP/jardulik-web/swagger/vendor"
          cp index.html styles.css app.js bot.js demo.json privacy.html terms.html bot.html guide.html 404.html sitemap.xml icon.svg "$RUNNER_TEMP/jardulik-web/"
          cp ../../../docs/images/landing-preview.png "$RUNNER_TEMP/jardulik-web/social.png"
          cp swagger/index.html swagger/openapi.json swagger/swagger.css swagger/swagger.js "$RUNNER_TEMP/jardulik-web/swagger/"
          cp swagger/vendor/LICENSE swagger/vendor/NOTICE swagger/vendor/provenance.json swagger/vendor/swagger-ui-bundle.js swagger/vendor/swagger-ui-bundle.js.LICENSE.txt swagger/vendor/swagger-ui.css "$RUNNER_TEMP/jardulik-web/swagger/vendor/"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/jardulik-web
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: publish
